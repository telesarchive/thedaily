<style>
:root {
  color-scheme: light;
  --bg: #F3F5F0;
  --surface: #FFFFFF;
  --ink: #18201C;
  --muted: #5F6B64;
  --line: #DDE3DA;
  --track: #E4E9E1;
  --accent: #23463C;
  --accent-ink: #FFFFFF;
  --danger: #B3402E;
  --breakfast: #E2A72E;
  --lunch: #5E9F6B;
  --dinner: #4A6FA5;
  --snacks: #C2577F;
  --radius: 18px;
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0F1311;
    --surface: #181E1B;
    --ink: #E8EDE7;
    --muted: #9AA69F;
    --line: #2A332E;
    --track: #232B27;
    --accent: #8FD1B4;
    --accent-ink: #0F1311;
    --danger: #F08A76;
    --breakfast: #F0BC4A;
    --lunch: #79BC86;
    --dinner: #7C9FD6;
    --snacks: #E07FA4;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px calc(env(safe-area-inset-bottom, 0px) + 110px);
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mark {
  display: flex; align-items: center; gap: 9px;
  margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.025em;
}
.mark-ring {
  width: 22px; height: 22px; border-radius: 50%;
  background: conic-gradient(var(--breakfast) 0 25%, var(--lunch) 0 50%, var(--dinner) 0 75%, var(--snacks) 0 100%);
  -webkit-mask: radial-gradient(circle, transparent 5px, #000 5.5px);
          mask: radial-gradient(circle, transparent 5px, #000 5.5px);
}
.icon-btn {
  display: grid; place-items: center;
  width: 44px; height: 44px; border: 0; border-radius: 50%;
  background: transparent; color: var(--muted);
}
.icon-btn:hover { color: var(--ink); }

.datebar { display: flex; align-items: center; gap: 2px; margin: 18px 0 2px -10px; }
.datebar .icon-btn { width: 36px; height: 36px; font-size: 22px; }
.date-label {
  border: 0; background: transparent; padding: 4px 6px;
  font-size: 17px; font-weight: 600;
}

/* Summary */
.summary { padding: 0 0 26px; }
.hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px; }
.remain { display: flex; flex-direction: column; gap: 4px; margin: 0; min-width: 0; }
.remain-num {
  font-size: clamp(56px, 19vw, 92px); font-weight: 800; line-height: 1;
  letter-spacing: -0.045em; font-variant-numeric: tabular-nums;
}
.remain-unit { font-size: 18px; font-weight: 500; color: var(--muted); }

/* Calendar */
.calendar { background: var(--surface); border-radius: var(--radius); padding: 8px 10px 12px; margin-top: 24px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.cal-head .icon-btn { font-size: 22px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 13px; color: var(--muted); padding: 4px 0 6px; }
.cal-day {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px;
  min-height: 52px; padding: 7px 0 4px; border: 0; border-radius: 10px; background: transparent;
}
.cal-day .num { font-size: 15px; font-weight: 600; line-height: 1.2; }
.cal-day .kcal { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.cal-day[aria-current="date"] { background: var(--ink); color: var(--bg); }
.cal-day[aria-current="date"] .kcal { color: inherit; opacity: .75; }
.cal-day:disabled { opacity: .3; cursor: default; }

}
.bubble {
  position: absolute; right: 4px; bottom: calc(100% + 10px); z-index: 5;
  width: max-content; max-width: 215px; margin: 0; padding: 8px 12px;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 12px;
  font-size: 15px; font-weight: 600; line-height: 1.3;
  opacity: 0; transform: translateY(6px) scale(.96); transform-origin: bottom right;
  transition: opacity .18s, transform .18s; pointer-events: none;
}
.bubble::after {
  content: ""; position: absolute; right: 30px; top: 100%;
  border: 7px solid transparent; border-top-color: var(--ink);
}
.bubble.show { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .bubble { transition: opacity .18s; transform: none; } }

.toggle-row { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 12px; font-weight: 600; }
.toggle-row input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }

.bar {
  position: relative; display: flex; gap: 3px;
  height: 16px; margin: 18px 0 4px;
  background: var(--track); border-radius: 99px; overflow: hidden;
}
.seg { height: 100%; flex: 0 1 0; min-width: 6px; transition: flex-grow .35s ease; }
.seg-breakfast { background: var(--breakfast); }
.seg-lunch { background: var(--lunch); }
.seg-dinner { background: var(--dinner); }
.seg-snacks { background: var(--snacks); }
.eaten { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }

.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0 0; }
.macros div { border-top: 1px solid var(--line); padding-top: 8px; }
.macros dt { font-size: 14px; color: var(--muted); }
.macros dd { margin: 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Meals */
.meal { background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.meal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.meal-head h2 { margin: 0; font-size: 18px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 10px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; }
.meal-breakfast .swatch { background: var(--breakfast); }
.meal-lunch .swatch { background: var(--lunch); }
.meal-dinner .swatch { background: var(--dinner); }
.meal-snacks .swatch { background: var(--snacks); }
.meal-kcal { font-weight: 600; font-variant-numeric: tabular-nums; }
.meal-kcal.zero { color: var(--muted); font-weight: 400; }

.entries { list-style: none; margin: 0; padding: 0; }
.entry { display: flex; align-items: center; gap: 10px; padding: 10px 6px 10px 16px; border-top: 1px solid var(--line); }
.entry-main { flex: 1; min-width: 0; }
.entry-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-sub { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-kcal { font-variant-numeric: tabular-nums; }
.remove { width: 36px; height: 36px; font-size: 22px; line-height: 1; }

.add-in-meal {
  display: block; width: 100%; text-align: left;
  border: 0; border-top: 1px solid var(--line); background: transparent;
  padding: 12px 16px; color: var(--accent); font-weight: 600;
}
.entries:empty + .add-in-meal { border-top-color: transparent; padding-top: 2px; }

.fab {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  border: 0; border-radius: 99px; padding: 15px 28px;
  background: var(--accent); color: var(--accent-ink);
  font-size: 17px; font-weight: 600;
  box-shadow: 0 8px 24px -8px rgba(20, 50, 40, .55);
}

/* Sheets */
dialog.sheet {
  padding: 0; border: 0;
  position: fixed; inset: auto 0 0 0; margin: 0 auto;
  width: 100%; max-width: 560px; max-height: min(90dvh, 860px);
  border-radius: 24px 24px 0 0;
  background: var(--surface); color: var(--ink);
}
dialog.sheet[open] { display: flex; flex-direction: column; animation: rise .28s cubic-bezier(.2,.8,.2,1); }
dialog.sheet::backdrop { background: rgba(8, 12, 10, .5); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  dialog.sheet[open] { animation: none; }
  .seg { transition: none; }
  html { scroll-behavior: auto; }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 12px 6px 20px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.sheet-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 6px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
}
.view[hidden] { display: none; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 99px;
  padding: 7px 14px; font-size: 15px;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.search-row { display: flex; gap: 8px; }
input[type="search"], input[type="text"], input[type="password"], input[type="number"], input.text, select {
  width: 100%; min-height: 48px; padding: 10px 14px;
  font-size: 17px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); -webkit-appearance: none; appearance: none;
}
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px;
  background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px;
}
.btn {
  min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; white-space: nowrap;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.block { width: 100%; }

.type-toggle { display: flex; gap: 18px; margin: 12px 0 4px; }
.type-toggle button { border: 0; background: transparent; padding: 4px 0; color: var(--muted); border-bottom: 2px solid transparent; }
.type-toggle button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

.status { color: var(--muted); margin: 14px 0; }
.list-title { font-size: 15px; color: var(--muted); font-weight: 500; margin: 16px 0 4px; }
.results { list-style: none; margin: 0; padding: 0; }
.result {
  display: flex; align-items: center; gap: 12px; width: 100%;
  text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent;
  padding: 12px 0;
}
.result-main { flex: 1; min-width: 0; }
.result-name { display: block; }
.result-sub { display: block; font-size: 14px; color: var(--muted); }
.result-kcal { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.result-kcal small { display: block; font-size: 12px; color: var(--muted); }

.text-link { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 12px 0; }

.detail-name { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 4px 0 2px; letter-spacing: -0.01em; }
.detail-sub { color: var(--muted); margin: 0 0 18px; }
.amount-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
.detail-kcal { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 4px; }
.detail-kcal strong { font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.detail-kcal span { color: var(--muted); }
.detail-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }

.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
.hint { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
.hint a { color: var(--accent); }
.settings-group { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
  display: flex; align-items: center; gap: 14px;
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px;
  background: var(--ink); color: var(--bg); font-size: 15px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10;
}
.toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="mark"><span class="mark-ring" aria-hidden="true"></span>TheDaily</h1>
    <button class="icon-btn" id="openSettings" aria-label="Settings">

    </button>
  </header>

  <nav class="datebar" aria-label="Choose day">

  <section class="summary" id="summary">

      <button class="icon-btn" id="calPrev" type="button" aria-label="Previous month">‹</button>
      <h2 id="calTitle"></h2>

    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>
</div>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'thedaily:v1';
  const API_URL = 'https://api.nal.usda.gov/fdc/v1/foods/search';
  const MEALS = [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner'], ['snacks', 'Snacks']];
  const MEAL_NAME = Object.fromEntries(MEALS);
  const TYPE_LABEL = { 'Foundation': 'USDA basic food', 'SR Legacy': 'USDA standard reference', 'Survey (FNDDS)': 'USDA survey food', 'Branded': 'Branded product' };

  const $ = (s, root = document) => root.querySelector(s);
  const $$ = (s, root = document) => [...root.querySelectorAll(s)];

  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style') n.style.cssText = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) {
      if (c == null || c === false) continue;
      n.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return n;
  }

  // ---------- Storage ----------
  function load() {
    const fresh = { settings: { apiKey: '', goal: 2000, showBuddy: true }, days: {}, recent: [] };
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === 'object') {
        return { settings: { ...fresh.settings, ...s.settings }, days: s.days || {}, recent: s.recent || [] };
      }
    } catch (e) { /* fall through to fresh state */ }
    return fresh;
  }
  let state = load();
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { toast('Couldn’t save. Your phone’s storage may be full.'); }
  }

  // ---------- Helpers ----------
  const fmt = n => Math.round(n || 0).toLocaleString();
  const fmt1 = n => (Math.round((n || 0) * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const noon = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; };
  const today = () => noon(new Date());
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parseNum = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : NaN; };

  let viewDate = today();
  let followToday = true;

  function dateLabel(d) {
    const diff = Math.round((d - today()) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === -1) return 'Yesterday';
    if (diff === 1) return 'Tomorrow';
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function defaultMeal() {
    const h = new Date().getHours();
    return h < 11 ? 'breakfast' : h < 16 ? 'lunch' : h < 21 ? 'dinner' : 'snacks';
  }
  function scaleNutrients(per100, grams) {
    const k = grams / 100;
    return { kcal: (per100.kcal || 0) * k, p: (per100.p || 0) * k, c: (per100.c || 0) * k, f: (per100.f || 0) * k };
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg, actionLabel, action) {
    const t = $('#toast');
    t.replaceChildren(el('span', { text: msg }));
    if (actionLabel) {
      t.append(el('button', { type: 'button', text: actionLabel, onclick: () => { action(); t.classList.remove('show'); } }));
    }
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 5000 : 2600);
  }

  // ---------- Cheer character ----------
  // character.png is a 6 x 4 grid of frames (one row per animation), drawn at half size for crisp Retina display.
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const Buddy = (() => {
    const FW = 95, FH = 125;
    const ANIM = {
      cheer:  { row: 0, ms: 115, loops: 2, still: 2 },
      giggle: { row: 1, ms: 120, loops: 2, still: 3 },
      idle:   { row: 2, ms: 150, loops: 1, still: 0 },
      worry:  { row: 3, ms: 170, loops: 1, still: 4 }
    };
    const wrap = $('#buddy'), sprite = $('#buddySprite'), bubble = $('#bubble');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let frameTimer, idleTimer, bubbleTimer;

    const show = (row, frame) => { sprite.style.backgroundPosition = `${-frame * FW}px ${-row * FH}px`; };

    function rest() {
      clearInterval(frameTimer);
      show(ANIM.idle.row, 0);
      clearTimeout(idleTimer);
      if (!reduce.matches) {
        idleTimer = setTimeout(() => {
          if (document.visibilityState === 'visible' && !wrap.hidden) play('idle'); else rest();
        }, 6000 + Math.random() * 7000);
      }
    }

    function play(name) {
      const a = ANIM[name];
      clearInterval(frameTimer);
      clearTimeout(idleTimer);
      if (reduce.matches) {
        show(a.row, a.still);
        idleTimer = setTimeout(rest, 2000);
        return;
      }
      let i = 0;
      const total = 6 * a.loops;
      show(a.row, 0);
      frameTimer = setInterval(() => {
        i++;
        if (i >= total) { rest(); return; }
        show(a.row, i % 6);
      }, a.ms);
    }

    function say(text) {
      bubble.textContent = text;
      bubble.classList.remove('show');
      void bubble.offsetWidth;
      bubble.classList.add('show');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 4000);
    }

    function react(name, text) {
      if (wrap.hidden) return;
      play(name);
      if (text) say(text);
    }

    function setVisible(v) {
      wrap.hidden = !v;
      if (v) rest(); else { clearInterval(frameTimer); clearTimeout(idleTimer); bubble.classList.remove('show'); }
    }

    sprite.addEventListener('click', () => react('giggle', pick([
      'You’ve got this!', 'One meal at a time.', 'Proud of you for tracking.', 'Keep showing up!'
    ])));

    return { react, setVisible };
  })();

  function dayTotal(key) {
    return (state.days[key] || []).reduce((s, e) => s + e.kcal, 0);
  }

  function cheerFor(before, after, wasEmpty) {
    const goal = Number(state.settings.goal) || 2000;
    if (before <= goal && after > goal) {
      Buddy.react('worry', 'A bit over today. Tomorrow’s a fresh start!');
    } else if (after > goal) {
      Buddy.react('giggle', 'Logged. Honest tracking is what counts.');
    } else if (wasEmpty) {
      Buddy.react('cheer', 'Great start!');
    } else if (before < goal * 0.9 && after >= goal * 0.9) {
      Buddy.react('cheer', 'Right on target today!');
    } else {
      Buddy.react('giggle', pick(['Logged!', 'Nice, keep it going.', 'Got it!', 'Every entry counts.']));
    }
  }

  function greet() {
    const key = dayKey(today());
    if (state.settings.lastGreet === key) return;
    state.settings.lastGreet = key;
    save();
    const h = new Date().getHours();
    setTimeout(() => Buddy.react('giggle', h < 12 ? 'Good morning!' : h < 17 ? 'Good afternoon!' : 'Good evening!'), 600);
  }

  // ---------- Main render ----------
  function render() {
    const list = state.days[dayKey(viewDate)] || [];
    const byMeal = { breakfast: 0, lunch: 0, dinner: 0, snacks: 0 };
    let total = 0, p = 0, c = 0, f = 0;
    for (const e of list) {
      byMeal[e.meal] = (byMeal[e.meal] || 0) + e.kcal;
      total += e.kcal; p += e.p || 0; c += e.c || 0; f += e.f || 0;
    }

    $('#dateLabel').textContent = dateLabel(viewDate);
    $('#dateLabel').setAttribute('aria-label',
      viewDate.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + '. Tap to go to today.');

    $('#totalNum').textContent = fmt(total);

    // The bar shows how the day's total splits across meals.
    const bar = $('#bar');
    bar.replaceChildren(...MEALS.map(([id]) =>
      byMeal[id] > 0 ? el('span', { class: `seg seg-${id}`, style: `flex-grow:${byMeal[id]}` }) : null
    ).filter(Boolean));
    bar.setAttribute('aria-label', MEALS.map(([id, name]) => `${name} ${fmt(byMeal[id])} kcal`).join(', '));

    $('#mP').textContent = `${fmt(p)} g`;
    $('#mC').textContent = `${fmt(c)} g`;
    $('#mF').textContent = `${fmt(f)} g`;

    $('#meals').replaceChildren(...MEALS.map(([id, name]) =>
      mealSection(id, name, list.filter(e => e.meal === id), byMeal[id])));

    renderCalendar();
  }

  function entrySub(e) {
    if (e.quick) return 'Entered manually';
    let amount;
    if (e.unit === 'g') amount = `${fmt1(e.qty)} g`;
    else if (e.unit === 'oz') amount = `${fmt1(e.qty)} oz (${fmt(e.grams)} g)`;
    else amount = (e.qty === 1 ? e.unit : `${fmt1(e.qty)} × ${e.unit}`) + ` (${fmt(e.grams)} g)`;
    return e.brand ? `${e.brand}, ${amount}` : amount;
  }

  function mealSection(id, name, entries, kcal) {
    return el('section', { class: `meal meal-${id}`, 'aria-label': name },
      el('div', { class: 'meal-head' },
        el('h2', {}, el('span', { class: 'swatch', 'aria-hidden': 'true' }), name),
        el('span', { class: 'meal-kcal' + (kcal ? '' : ' zero'), text: kcal ? `${fmt(kcal)} kcal` : '0 kcal' })
      ),
      el('ul', { class: 'entries' }, entries.map(e =>
        el('li', { class: 'entry' },
          el('div', { class: 'entry-main' },
            el('div', { class: 'entry-name', text: e.name }),
            el('div', { class: 'entry-sub', text: entrySub(e) })
          ),
          el('span', { class: 'entry-kcal', text: fmt(e.kcal) }),
          el('button', { class: 'icon-btn remove', type: 'button', 'aria-label': `Remove ${e.name}`, text: '×', onclick: () => removeEntry(e.id) })
        )
      )),
      el('button', { class: 'add-in-meal', type: 'button', text: `+ Add to ${name.toLowerCase()}`, onclick: () => openAdd(id) })
    );
  }

  function addEntry(entry) {
    const key = dayKey(viewDate);
    const before = dayTotal(key);
    const wasEmpty = !(state.days[key] || []).length;
    (state.days[key] ||= []).push(entry);
    save();
    render();
    cheerFor(before, before + entry.kcal, wasEmpty);
  }

  function removeEntry(id) {
    const key = dayKey(viewDate);
    const arr = state.days[key] || [];
    const idx = arr.findIndex(e => e.id === id);
    if (idx < 0) return;
    const [removed] = arr.splice(idx, 1);
    if (!arr.length) delete state.days[key];
    save();
    render();
    toast(`Removed ${removed.name}`, 'Undo', () => {
      (state.days[key] ||= []).splice(idx, 0, removed);
      save();
      render();
    });
  }

  // ---------- USDA API ----------
  function nutrientValue(map, ids) {
    for (const id of ids) {
      const n = map[id];
      if (n && typeof n.value === 'number') return n;
    }
    return null;
  }

  function titleCase(s) {
    return s.toLowerCase().replace(/(^|[\s(/-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
  }

  function normalizeFood(f) {
    const map = {};
    for (const x of f.foodNutrients || []) map[x.nutrientId] = x;

    let kcal = null;
    const energy = nutrientValue(map, [1008, 2047, 2048]);
    if (energy && /kcal/i.test(energy.unitName || 'kcal')) kcal = energy.value;
    else if (map[1062] && typeof map[1062].value === 'number') kcal = map[1062].value / 4.184;

    const val = id => (map[id] && typeof map[id].value === 'number' ? map[id].value : 0);
    const per100 = { kcal, p: val(1003), c: val(1005), f: val(1004) };

    const portions = [];
    const seen = new Set();
    const addPortion = (label, grams) => {
      if (!label || !(grams > 0) || seen.has(label)) return;
      seen.add(label);
      portions.push({ label, grams });
    };
    if (f.servingSize && /^(g|grm|ml|mlt)$/i.test(f.servingSizeUnit || '')) {
      const house = (f.householdServingFullText || '').trim();
      addPortion(house ? house.toLowerCase() : 'serving', f.servingSize);
    }
    for (const m of (f.foodMeasures || []).slice(0, 10)) {
      if (m.disseminationText && !/quantity not specified/i.test(m.disseminationText)) addPortion(m.disseminationText, m.gramWeight);
    }
    portions.push({ label: 'g', grams: 1 }, { label: 'oz', grams: 28.3495 });

    let name = (f.description || 'Unnamed food').trim();
    if (name === name.toUpperCase()) name = titleCase(name);
    let brand = (f.brandName || f.brandOwner || '').trim();
    if (brand && brand === brand.toUpperCase()) brand = titleCase(brand);

    return { fdcId: f.fdcId, name, brand, type: f.dataType, per100, portions };
  }

  async function searchFoods(query, type) {
    const params = new URLSearchParams({
      api_key: state.settings.apiKey || 'DEMO_KEY',
      query,
      pageSize: '30',
      dataType: type === 'branded' ? 'Branded' : 'Foundation,SR Legacy,Survey (FNDDS)'
    });
    const res = await fetch(`${API_URL}?${params}`);
    if (res.status === 429) throw new Error('rate');
    if (res.status === 403 || res.status === 401) throw new Error('key');
    if (!res.ok) throw new Error('http');
    const data = await res.json();
    return (data.foods || []).map(normalizeFood).filter(f => f.per100.kcal != null);
  }

  // ---------- Add food sheet ----------
  const addSheet = $('#addSheet');
  let addMeal = 'breakfast';
  let searchType = 'generic';
  let selected = null;
  let searchSeq = 0;

  function showView(name) {
    for (const v of $$('.view', addSheet)) v.hidden = v.dataset.view !== name;
    addSheet.dataset.view = name;
  }

  function refreshMealLabels() {
    for (const b of $$('.chip', $('#mealChips'))) b.setAttribute('aria-pressed', String(b.dataset.meal === addMeal));
    const label = `Add to ${MEAL_NAME[addMeal].toLowerCase()}`;
    $('#addSelected').textContent = label;
    $('#quickAdd').textContent = label;
  }

  $('#mealChips').append(...MEALS.map(([id, name]) =>
    el('button', { class: 'chip', type: 'button', 'data-meal': id, text: name, onclick: () => { addMeal = id; refreshMealLabels(); } })
  ));

  function openAdd(meal) {
    addMeal = meal || defaultMeal();
    refreshMealLabels();
    $('#addTitle').textContent = followToday ? 'Add food' : `Add food for ${dateLabel(viewDate)}`;
    $('#q').value = '';
    showView('search');
    showRecent();
    addSheet.showModal();
  }

  function setStatus(msg) { $('#searchStatus').textContent = msg; }

  function resultList(foods) {
    return el('ul', { class: 'results' }, foods.map(food =>
      el('li', {},
        el('button', { class: 'result', type: 'button', onclick: () => openDetail(food) },
          el('span', { class: 'result-main' },
            el('span', { class: 'result-name', text: food.name }),
            el('span', { class: 'result-sub', text: food.brand || TYPE_LABEL[food.type] || food.type || '' })
          ),
          el('span', { class: 'result-kcal' }, fmt(food.per100.kcal), el('small', { text: 'per 100 g' }))
        )
      )
    ));
  }

  function showRecent() {
    const wrap = $('#resultsWrap');
    if (state.recent.length) {
      setStatus('');
      wrap.replaceChildren(el('p', { class: 'list-title', text: 'Recent' }), resultList(state.recent));
    } else {
      setStatus('Search the USDA food database for anything you ate, like “banana” or “grilled chicken breast”.');
      wrap.replaceChildren();
    }
  }

  async function runSearch() {
    const q = $('#q').value.trim();
    if (!q) { showRecent(); return; }
    const seq = ++searchSeq;
    setStatus('Searching…');
    $('#resultsWrap').replaceChildren();
    try {
      const foods = await searchFoods(q, searchType);
      if (seq !== searchSeq) return;
      if (!foods.length) {
        setStatus(searchType === 'generic'
          ? `No matches for “${q}”. Try a simpler word, or switch to Brands.`
          : `No branded products match “${q}”. Try the brand name plus the product.`);
        return;
      }
      setStatus('');
      $('#resultsWrap').replaceChildren(resultList(foods));
    } catch (err) {
      if (seq !== searchSeq) return;
      const msgs = {
        rate: 'Search limit reached for now. Add your own free API key in Settings to search more.',
        key: 'The USDA didn’t accept the API key. Check it in Settings.'
      };
      setStatus(msgs[err.message] || 'Couldn’t reach the USDA database. Check your connection and try again.');
    }
  }

  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    $('#q').blur();
    runSearch();
  });

  for (const b of $$('.type-toggle button')) {
    b.addEventListener('click', () => {
      searchType = b.dataset.type;
      for (const x of $$('.type-toggle button')) x.setAttribute('aria-pressed', String(x === b));
      if ($('#q').value.trim()) runSearch();
    });
  }

  function openDetail(food) {
    selected = food;
    $('#dName').textContent = food.name;
    $('#dSub').textContent = food.brand || TYPE_LABEL[food.type] || '';
    const sel = $('#dUnit');
    sel.replaceChildren(...food.portions.map((p, i) =>
      el('option', { value: String(i), text: p.label === 'g' ? 'grams' : p.label === 'oz' ? 'ounces' : `${p.label} (${fmt1(p.grams)} g)` })
    ));
    let unitIdx, qty;
    if (food.lastUnit != null && food.portions[food.lastUnit]) {
      unitIdx = food.lastUnit; qty = food.lastQty;
    } else if (food.portions[0].label !== 'g') {
      unitIdx = 0; qty = 1;
    } else {
      unitIdx = 0; qty = 100;
    }
    sel.value = String(unitIdx);
    $('#dQty').value = String(qty);
    showView('detail');
    updateDetail();
  }

  function currentDetail() {
    if (!selected) return null;
    const qty = parseNum($('#dQty').value);
    const portion = selected.portions[Number($('#dUnit').value)];
    if (!(qty > 0) || !portion) return null;
    const grams = qty * portion.grams;
    return { qty, portion, grams, n: scaleNutrients(selected.per100, grams) };
  }

  function updateDetail() {
    const d = currentDetail();
    $('#addSelected').disabled = !d;
    const n = d ? d.n : { kcal: 0, p: 0, c: 0, f: 0 };
    $('#dKcal').textContent = fmt(n.kcal);
    $('#dP').textContent = `${fmt1(n.p)} g`;
    $('#dC').textContent = `${fmt1(n.c)} g`;
    $('#dF').textContent = `${fmt1(n.f)} g`;
  }
  $('#dQty').addEventListener('input', updateDetail);
  $('#dUnit').addEventListener('change', () => {
    const p = selected.portions[Number($('#dUnit').value)];
    if (p.label === 'g' && parseNum($('#dQty').value) < 5) $('#dQty').value = '100';
    updateDetail();
  });

  $('#addSelected').addEventListener('click', () => {
    const d = currentDetail();
    if (!d) return;
    addEntry({
      id: uid(), meal: addMeal, name: selected.name, brand: selected.brand, fdcId: selected.fdcId,
      qty: d.qty, unit: d.portion.label, grams: d.grams,
      kcal: d.n.kcal, p: d.n.p, c: d.n.c, f: d.n.f
    });
    const unitIdx = Number($('#dUnit').value);
    state.recent = [{ ...selected, lastQty: d.qty, lastUnit: unitIdx },
      ...state.recent.filter(r => r.fdcId !== selected.fdcId)].slice(0, 25);
    save();
    addSheet.close();
    toast(`Added ${selected.name} to ${MEAL_NAME[addMeal].toLowerCase()}`);
  });

  $('#toQuick').addEventListener('click', () => {
    $('#quickName').value = $('#q').value.trim();
    $('#quickKcal').value = '';
    showView('quick');
    $('#quickKcal').focus();
  });

  $('#quickForm').addEventListener('submit', e => {
    e.preventDefault();
    const kcal = parseNum($('#quickKcal').value);
    if (!(kcal >= 0)) { $('#quickKcal').focus(); toast('Enter the number of calories.'); return; }
    const name = $('#quickName').value.trim() || 'Quick add';
    addEntry({ id: uid(), meal: addMeal, name, quick: true, kcal, p: 0, c: 0, f: 0 });
    addSheet.close();
    toast(`Added ${name} to ${MEAL_NAME[addMeal].toLowerCase()}`);
  });

  for (const b of $$('[data-back]', addSheet)) b.addEventListener('click', () => showView('search'));

  // ---------- Settings ----------
  const settingsSheet = $('#settingsSheet');
  $('#openSettings').addEventListener('click', () => {
    $('#goalInput').value = String(state.settings.goal);
    $('#keyInput').value = state.settings.apiKey || '';
    $('#buddyInput').checked = state.settings.showBuddy !== false;
    settingsSheet.showModal();
  });
  $('#settingsForm').addEventListener('submit', e => {
    e.preventDefault();
    const goal = Math.round(parseNum($('#goalInput').value));
    if (!(goal >= 500 && goal <= 10000)) { toast('Set a goal between 500 and 10,000 kcal.'); return; }
    state.settings.goal = goal;
    state.settings.apiKey = $('#keyInput').value.trim();
    state.settings.showBuddy = $('#buddyInput').checked;
    Buddy.setVisible(state.settings.showBuddy);
    save();
    render();
    settingsSheet.close();
    toast('Settings saved');
  });

  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: `thedaily-backup-${dayKey(today())}.json` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || typeof data.days !== 'object') throw new Error('bad');
      if (!confirm('Replace everything on this device with this backup?')) return;
      state = { settings: { apiKey: '', goal: 2000, showBuddy: true, ...data.settings }, days: data.days, recent: data.recent || [] };
      Buddy.setVisible(state.settings.showBuddy !== false);
      save();
      render();
      settingsSheet.close();
      toast('Backup imported');
    } catch (err) {
      toast('That file isn’t a TheDaily backup.');
    }
  });

  // ---------- Shared sheet behavior ----------
  for (const d of [addSheet, settingsSheet]) {
    d.addEventListener('click', e => { if (e.target === d) d.close(); });
    for (const b of $$('[data-close]', d)) b.addEventListener('click', () => d.close());
  }

  // ---------- Calendar ----------
  let calMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1, 12);

  function renderCalendar() {
    const grid = $('#calGrid');
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    $('#calTitle').textContent = calMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const nowKey = dayKey(today()), viewKey = dayKey(viewDate);
    const thisMonth = new Date(today().getFullYear(), today().getMonth(), 1, 12);
    $('#calNext').disabled = calMonth >= thisMonth;

    const cells = [];
    // Weekday headers, starting on Sunday (Jan 4, 1970 was a Sunday).
    for (let i = 0; i < 7; i++) {
      const name = new Date(1970, 0, 4 + i).toLocaleDateString(undefined, { weekday: 'narrow' });
      cells.push(el('div', { class: 'cal-dow', 'aria-hidden': 'true', text: name }));
    }
    const firstDow = new Date(y, m, 1).getDay();
    for (let i = 0; i < firstDow; i++) cells.push(el('div'));
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(y, m, day, 12);
      const key = dayKey(d);
      const total = dayTotal(key);
      const future = key > nowKey;
      cells.push(el('button', {
        type: 'button',
        class: 'cal-day' + (key === nowKey ? ' today' : ''),
        'aria-current': key === viewKey ? 'date' : null,
        'aria-label': d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) +
          (total ? `, ${fmt(total)} kcal` : ''),
        disabled: future,
        onclick: () => { setDay(d); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      },
        el('span', { class: 'num', text: day }),
        total ? el('span', { class: 'kcal', text: fmt(total) }) : null
      ));
    }
    grid.replaceChildren(...cells);
  }

  $('#calPrev').addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1, 12); renderCalendar(); });
  $('#calNext').addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1, 12); renderCalendar(); });

  // ---------- Day navigation ----------
  function setDay(d) {
    viewDate = noon(d);
    followToday = dayKey(viewDate) === dayKey(today());
    calMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1, 12);
    render();
  }
  $('#prevDay').addEventListener('click', () => { const d = new Date(viewDate); d.setDate(d.getDate() - 1); setDay(d); });
  $('#nextDay').addEventListener('click', () => { const d = new Date(viewDate); d.setDate(d.getDate() + 1); setDay(d); });
  $('#dateLabel').addEventListener('click', () => setDay(today()));
  $('#fab').addEventListener('click', () => openAdd());

  // When the app comes back from the background on a new day, jump to that day.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && followToday && dayKey(viewDate) !== dayKey(today())) setDay(today());
  });

  render();
  Buddy.setVisible(state.settings.showBuddy !== false);
  greet();
})();
</script>
</body>
</html>
